<title>節奏市長 PoC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a council-hall night board — HUD on top, the citizen card, the 8-cell beat track, one big press button. */
:root{
  --ink:#151b27; --panel:#1f2838; --panel-2:#273246; --line:#36435c;
  --text:#eef1f6; --muted:#97a3ba;
  --signal:#f2b632; --alert:#e8604c; --ok:#5cc28f; --aide:#7fa6e8;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:2.4rem;line-height:1.15}
h2{font-size:1.4rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--signal);text-transform:uppercase;font-family:var(--f-mono)}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:10px 16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button.primary{background:var(--signal);color:#1b1608;border-color:var(--signal);font-weight:700}
input[type=text]{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;max-width:260px}
label{font-size:.85rem;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2)}
ul.how{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--signal);transition:width .2s}
.bar.aide i{background:var(--aide)}
.bar.full i{background:var(--alert)}

/* Citizen card */
.card{min-height:132px;display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.1em;font-family:var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.tag.s{background:var(--alert);color:#fff}
.tag.a{background:var(--aide);color:#0e1a2e}
.ask{font-size:1.15rem;font-family:var(--f-display)}
.reply{font-size:.95rem;color:var(--muted);min-height:1.6em}
.reply.good{color:var(--ok)}.reply.bad{color:var(--alert)}.reply.aide{color:var(--aide)}

/* Beat track */
.track{display:grid;grid-template-columns:repeat(6,1fr) 1.6fr .7fr;gap:6px;align-items:center}
.cell{height:44px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.8rem;color:var(--muted);transition:background .06s,transform .06s}
.cell.on{background:var(--signal);color:#1b1608;border-color:var(--signal)}
.cell.hid{opacity:.35}
.cell.alarm.on{background:var(--alert);border-color:var(--alert);color:#fff}
.cell.target{height:60px;border:2px dashed var(--signal);color:var(--signal);font-size:.9rem}
.cell.target.now{transform:scale(1.06)}
.cell.target.r-perfect{background:var(--ok);border-style:solid;border-color:var(--ok);color:#0b2116}
.cell.target.r-good{background:color-mix(in srgb,var(--ok) 55%,var(--panel-2));border-style:solid;color:#0b2116}
.cell.target.r-miss{background:var(--alert);border-style:solid;border-color:var(--alert);color:#fff}
.cell.target.r-assist{background:var(--aide);border-style:solid;border-color:var(--aide);color:#0e1a2e}
.cell.rest{opacity:.25}
.fb{text-align:center;font-family:var(--f-mono);min-height:1.6em;font-size:.95rem}

.controls{display:grid;grid-template-columns:3fr 1.2fr;gap:10px}
.press{height:96px;font-family:var(--f-display);font-size:1.4rem;background:var(--signal);color:#1b1608;border-color:var(--signal)}
.press.hit{filter:brightness(1.25)}
.aidebtn{height:96px;font-size:.95rem;line-height:1.3}
.aidebtn[disabled]{opacity:.4;cursor:not-allowed}
.banner{background:color-mix(in srgb,var(--alert) 22%,var(--panel));border:1px solid var(--alert);border-radius:8px;padding:10px 14px;font-size:.92rem}

/* Result */
.grade{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--signal)}
.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.stats td{padding:6px 0;border-bottom:1px solid var(--line)}
.stats td:last-child{text-align:right;font-family:var(--f-mono)}
.heads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.head{min-width:0}
.head .who{font-size:.75rem;letter-spacing:.12em;font-family:var(--f-mono);color:var(--muted)}
.head p{font-family:var(--f-display);font-size:1.05rem;margin-top:6px}
.head.pro{border-top:3px solid var(--ok)}.head.con{border-top:3px solid var(--alert)}
@media (max-width:520px){.hud,.heads{grid-template-columns:1fr} h1{font-size:2rem} .controls{grid-template-columns:2fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

  <!-- Title -->
  <section id="scr-title" class="stack">
    <div class="stack">
      <span class="eyebrow">Proof of concept · 第一章試玩</span>
      <h1>節奏市長</h1>
      <p class="muted">選前最後一個月，市民一個接一個來陳情。前六拍是預告，你只要在第七拍按下去。</p>
    </div>
    <div class="panel stack">
      <label for="name">替你的候選人取名字</label>
      <input id="name" type="text" maxlength="8" placeholder="例如：林小安" autocomplete="off">
      <ul class="how">
        <li>一般陳情：亮六格黃燈，第七格按 <kbd>空白鍵</kbd> 或點大按鈕。</li>
        <li>臨場提問：沒有預告，只響兩聲警示，判定時間窗縮短一半。</li>
        <li>幕僚接話：按 <kbd>F</kbd> 讓幕僚代答下一題。用三次量表會滿，下一題必須本人回答。</li>
      </ul>
      <div class="row">
        <button id="btn-calib">先校正延遲</button>
        <button id="btn-start" class="primary">開始</button>
        <span id="calib-note" class="muted mono"></span>
      </div>
    </div>
  </section>

  <!-- Calibration -->
  <section id="scr-calib" class="panel stack" hidden>
    <h2>延遲校正</h2>
    <p class="muted">聽到第三拍之後，跟著每一拍按空白鍵或下方按鈕，共 10 拍。</p>
    <div id="calib-count" class="fb mono">準備</div>
    <button id="calib-tap" class="press">跟拍</button>
  </section>

  <!-- Play -->
  <section id="scr-play" class="stack" hidden>
    <div class="hud panel">
      <div class="meter"><div class="lbl"><span>民調好感度</span><span id="fav-n" class="mono">50</span></div><div class="bar"><i id="fav-bar"></i></div></div>
      <div class="meter"><div class="lbl"><span>誰在答詢</span><span id="aide-n" class="mono">0</span></div><div id="aide-wrap" class="bar aide"><i id="aide-bar" style="width:0"></i></div></div>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div class="panel card">
      <span id="tag" class="tag">第 0 / 16 題</span>
      <p id="ask" class="ask">準備……</p>
      <p id="reply" class="reply"></p>
    </div>
    <div id="track" class="track" aria-hidden="true"></div>
    <div id="fb" class="fb"></div>
    <div class="controls">
      <button id="btn-press" class="press">回應（空白鍵）</button>
      <button id="btn-aide" class="aidebtn">幕僚接話<br><span class="muted">F</span></button>
    </div>
  </section>

  <!-- Result -->
  <section id="scr-result" class="stack" hidden>
    <div class="panel row" style="gap:20px">
      <div id="grade" class="grade">A</div>
      <div class="stack" style="gap:4px;min-width:0">
        <span class="eyebrow">第一章結算</span>
        <h2 id="res-title">好感度 0</h2>
      </div>
    </div>
    <div class="heads">
      <div class="panel head pro"><span class="who">支持者觀點</span><p id="h-pro"></p></div>
      <div class="panel head con"><span class="who">批評者觀點</span><p id="h-con"></p></div>
    </div>
    <div class="panel"><table class="stats"><tbody id="stats"></tbody></table></div>
    <div class="row"><button id="btn-again" class="primary">再玩一次</button><button id="btn-home">回標題</button></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const BPM = 100, BEAT = 60 / BPM, PL = 8, CI = 4, TARGET = 6;
const CHART = 'NNNSNNSNNSNSNNSN'.split('');
const REQ_N = ["早上捷運擠不上去，可以加班次嗎？","巷口路燈壞三天了，晚上好暗。","夜市太吵，我們樓上睡不著。","公園溜滑梯什麼時候修好？","公車站可以加個遮雨棚嗎？","人行道都被機車停滿了。","老公寓沒電梯，阿嬤下不了樓。","垃圾車可以晚一點來嗎？我下班趕不上。","河濱步道的燈可以開晚一點嗎？","颱風前水溝可以先清一下嗎？","學校門口接送好危險。"];
const REQ_S = ["這項政見的預算從哪裡來？","您自己平常怎麼通勤？","昨晚停電，您第一時間在哪？","可以不看稿講三十秒嗎？","哪一項承諾最可能做不到？"];
const R_HIT = ["收到，這週內給您答覆。","我記下來了，馬上請同仁處理。","這個問題很好，我們一起來解決。","明天我就去現場看。"];
const R_S = ["好問題，我直接回答您。","這題我自己來。","我的答案很簡單——"];
const PROG = [110, 87.31, 130.81, 98];

let ctx, master, mode = 'title', S = null, C = null;
let calib = 0;
try { calib = parseFloat(localStorage.getItem('rm-calib')) || 0; } catch (e) {}
try { $('#name').value = localStorage.getItem('rm-name') || ''; } catch (e) {}
showCalibNote();

function show(id){ ['title','calib','play','result'].forEach(k => $('#scr-'+k).hidden = k !== id); mode = id; }
function showCalibNote(){ $('#calib-note').textContent = calib ? `延遲修正 ${calib>0?'+':''}${Math.round(calib*1000)} ms` : ''; }
function ensureAudio(){
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .7; master.connect(ctx.destination); }
  if (ctx.state === 'suspended') ctx.resume();
}
const outLat = () => (ctx.outputLatency || 0) + (ctx.baseLatency || 0);

// ---- sounds ----
function env(g,t,v,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+d); }
function blip(t,f,d,type='sine',v=.25){ const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); env(g,t,v,d); o.connect(g).connect(master); o.start(t); o.stop(t+d+.03); }
function kick(t,v=.5){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(g).connect(master); o.start(t); o.stop(t+.2); }
function bass(t,f){ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t); env(g,t,.22,BEAT*3.6); o.connect(g).connect(master); o.start(t); o.stop(t+BEAT*3.8); }
let noiseBuf;
function snap(t,v=.35){
  if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.08,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); }
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain(); s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=1800; g.gain.value=v; s.connect(f).connect(g).connect(master); s.start(t);
}

// ---- track UI ----
const cells = [];
for (let i=0;i<8;i++){ const c=document.createElement('div'); c.className='cell'; $('#track').appendChild(c); cells.push(c); }
function drawTrack(ph,b){
  cells.forEach((c,i)=>{
    c.className='cell'; c.textContent='';
    if(i===TARGET){ c.classList.add('target'); c.textContent='7'; if(b===TARGET) c.classList.add('now'); if(ph&&ph.result) c.classList.add('r-'+ph.result); }
    else if(i===7){ c.classList.add('rest'); }
    else if(!ph || ph.type==='N'){ c.textContent=i+1; if(ph && b>=i) c.classList.add('on'); }
    else { if(i<5){ c.classList.add('hid'); c.textContent='?'; } else { c.classList.add('alarm'); c.textContent='!'; if(b>=5) c.classList.add('on'); } }
  });
}
drawTrack(null,-1);

// ---- game ----
function newGame(){
  let n=0,s=0;
  const ph = CHART.map(type => ({ type, assist:false, forced:false, judged:false, result:null,
    text: type==='S' ? REQ_S[s++ % REQ_S.length] : REQ_N[n++ % REQ_N.length] }));
  return { ph, t0: ctx.currentTime + .6, next: 0, vis: [], fav: 50, meter: 0, assists: 0, events: 0, locked: new Set(),
    stats: { perfect:0, good:0, miss:0, assist:0 }, sTot: 0, sHit: 0, endT: null, cur: -1, offs: [] };
}
const beatTime = i => S.t0 + i*BEAT;
const targetTime = p => beatTime(CI + p*PL + TARGET);
const startTime = p => beatTime(CI + p*PL);

function schedule(){
  while (S.endT===null && beatTime(S.next) < ctx.currentTime + .15){
    const i=S.next, t=beatTime(i);
    if (i < CI){ kick(t,.5); blip(t, i===CI-1?880:660, .08, 'sine', .2); S.vis.push({t, k:'count', n:CI-i}); }
    else {
      const p=Math.floor((i-CI)/PL), b=(i-CI)%PL;
      if (p >= S.ph.length){ S.endT = t; break; }
      const ph=S.ph[p];
      kick(t, b%2===0 ? .42 : .22);
      if (b===0||b===4) bass(t, PROG[p%4]);
      if (ph.type==='N' && b<=5) blip(t, b===0?1040:880, .07, 'sine', .22);
      if (ph.type==='S' && b===5){ blip(t,990,.06,'square',.12); blip(t+BEAT/2,990,.06,'square',.12); }
      if (ph.assist && b===TARGET){ snap(t,.3); blip(t,523,.14,'triangle',.18); }
      S.vis.push({t, k:'beat', p, b});
    }
    S.next++;
  }
}

function applyVis(v){
  if (v.k==='count'){ $('#ask').textContent = v.n>1 ? `${v.n-1}…` : '開始'; $('#tag').textContent='準備'; return; }
  const ph=S.ph[v.p];
  if (v.b===0){
    S.cur=v.p;
    const tag=$('#tag'); tag.className='tag'+(ph.type==='S'?' s':'')+(ph.assist?' a':'');
    tag.textContent = `第 ${v.p+1} / ${S.ph.length} 題 · ` + (ph.forced?'本人回答':ph.type==='S'?'臨場提問':'市民陳情') + (ph.assist?' · 幕僚代答':'');
    $('#ask').textContent = ph.forced ? `記者：剛剛都是幕僚在答，這題請候選人本人回答。${ph.text}` : (ph.type==='S' ? `記者：${ph.text}` : ph.text);
    setReply('','');
    updAideBtn();
  }
  if (v.p===S.cur) drawTrack(ph, v.b);
}

function setReply(txt,cls){ const r=$('#reply'); r.textContent=txt; r.className='reply '+cls; }
function fb(txt){ $('#fb').textContent=txt; }
function hud(){
  $('#fav-n').textContent=S.fav; $('#fav-bar').style.width=S.fav+'%';
  $('#aide-n').textContent=S.meter; $('#aide-bar').style.width=S.meter+'%';
  $('#aide-wrap').classList.toggle('full', S.meter>=68);
}
const pick = a => a[Math.floor(Math.random()*a.length)];
const name = () => ($('#name').value.trim() || '候選人');

function judge(p,res,d){
  const ph=S.ph[p]; ph.judged=true; ph.result=res; S.stats[res]++;
  if (ph.type==='S'){ S.sTot++; if(res==='perfect'||res==='good') S.sHit++; }
  if (d!=null && res!=='miss') S.offs.push(d);
  S.fav = Math.max(0, Math.min(100, S.fav + ({perfect:4, good:2, assist:1, miss: ph.type==='S'?-8:-6})[res]));
  const ms = d==null ? '' : ` ${d<0?'早':'晚'} ${Math.abs(Math.round(d*1000))} ms`;
  if (res==='perfect'){ fb('完美'+ms); setReply(`${name()}：${pick(ph.type==='S'?R_S:R_HIT)}`,'good'); }
  else if (res==='good'){ fb('命中'+ms); setReply(`${name()}：${pick(ph.type==='S'?R_S:R_HIT)}`,'good'); }
  else if (res==='assist'){ fb('幕僚代答'); setReply('幕僚：這部分由我來補充說明。','aide'); }
  else { fb('漏拍'+ms); setReply(ph.type==='S' ? '記者：……候選人沒有回答。' : '市民：……他是不是沒聽到？','bad'); }
  if (p===S.cur) drawTrack(ph, TARGET);
  hud();
}

function press(){
  const now=ctx.currentTime; blip(now,1320,.05,'square',.1);
  const btn=$('#btn-press'); btn.classList.add('hit'); setTimeout(()=>btn.classList.remove('hit'),80);
  const adj=now-outLat()-calib; let best=-1, bd=9;
  S.ph.forEach((ph,p)=>{ if(ph.judged||ph.assist) return; const d=adj-targetTime(p); if(Math.abs(d)<Math.abs(bd)){ bd=d; best=p; } });
  if (best<0 || Math.abs(bd)>.2){ fb('空拍'); return; }
  const w = S.ph[best].type==='S' ? {p:.022,g:.05} : {p:.045,g:.10};
  const a=Math.abs(bd);
  judge(best, a<=w.p?'perfect':a<=w.g?'good':'miss', bd);
}

function nextOpen(){ const now=ctx.currentTime; return S.ph.findIndex((ph,i)=>startTime(i) > now+.2); }
function updAideBtn(){
  const p=nextOpen(); const b=$('#btn-aide');
  b.disabled = p<0 || S.locked.has(p) || S.ph[p].forced || S.ph[p].assist;
}
function assist(){
  const p=nextOpen(); if(p<0) return;
  const ph=S.ph[p];
  if (ph.assist){ fb('下一題已經安排幕僚'); return; }
  if (S.locked.has(p)||ph.forced){ fb('這題必須本人回答'); return; }
  ph.assist=true; S.assists++; S.meter=Math.min(100,S.meter+34);
  fb(`第 ${p+1} 題由幕僚代答`);
  if (S.meter>=100){
    const q=p+1;
    if (q<S.ph.length){ S.ph[q].type='S'; S.ph[q].forced=true; S.locked.add(q); S.locked.add(q+1); }
    S.meter=0; S.events++;
    const bn=$('#banner'); bn.hidden=false; bn.textContent='「誰在答詢」量表滿了：再下一題必須本人回答，而且接下來兩題不能找幕僚。';
    setTimeout(()=>bn.hidden=true, BEAT*PL*2*1000);
  }
  hud(); updAideBtn();
}

function loop(){
  if (mode!=='play') return;
  schedule();
  const heard = ctx.currentTime - outLat();
  while (S.vis.length && S.vis[0].t <= heard) applyVis(S.vis.shift());
  const adj = heard - calib;
  S.ph.forEach((ph,p)=>{
    if (ph.judged) return;
    const T=targetTime(p);
    if (ph.assist && heard>=T) judge(p,'assist',null);
    else if (!ph.assist && adj > T + (ph.type==='S'?.05:.10)) judge(p,'miss',null);
  });
  if (S.endT!==null && heard > S.endT + BEAT) return finish();
  requestAnimationFrame(loop);
}

function start(){
  ensureAudio();
  try { localStorage.setItem('rm-name', $('#name').value.trim()); } catch(e){}
  S=newGame(); show('play'); hud(); fb(''); setReply('',''); $('#banner').hidden=true; drawTrack(null,-1); updAideBtn();
  requestAnimationFrame(loop);
}

function finish(){
  show('result');
  const st=S.stats, hits=st.perfect+st.good, total=S.ph.length;
  const grade = S.fav>=85?'S':S.fav>=70?'A':S.fav>=50?'B':'C';
  $('#grade').textContent=grade;
  $('#res-title').textContent=`${name()}・好感度 ${S.fav}`;
  $('#h-pro').textContent = S.assists
    ? `${name()}親自回應 ${hits} 位市民，團隊分工順暢，幕僚支援 ${S.assists} 次`
    : `${name()}全程親自上陣，${total} 題接住 ${hits} 題`;
  $('#h-con').textContent = S.assists
    ? `${S.assists} 題靠幕僚代答，臨場提問只接住 ${S.sHit}/${S.sTot}`
    : `臨場提問只接住 ${S.sHit}/${S.sTot}，漏掉 ${st.miss} 位市民`;
  const avg = S.offs.length ? Math.round(S.offs.reduce((a,b)=>a+b,0)/S.offs.length*1000) : 0;
  const rows=[['完美',st.perfect],['命中',st.good],['漏拍',st.miss],['幕僚代答',st.assist],['臨場提問接住',`${S.sHit} / ${S.sTot}`],['被要求本人回答',S.events],['平均偏移',`${avg>0?'+':''}${avg} ms`]];
  $('#stats').innerHTML = rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

// ---- calibration ----
function calibStart(){
  ensureAudio(); show('calib');
  const n=13, t0=ctx.currentTime+.6;
  C={t0,n,taps:[]};
  for(let i=0;i<n;i++){ const t=t0+i*BEAT; kick(t,.5); blip(t,i<3?660:880,.07,'sine',.22); }
  const tick=()=>{ if(mode!=='calib') return; const h=ctx.currentTime-outLat(); const i=Math.floor((h-t0)/BEAT);
    $('#calib-count').textContent = h<t0 ? '準備' : i<3 ? `聽 ${i+1}` : i<n ? `跟拍 ${i-2} / ${n-3}` : '計算中';
    if (h > t0+n*BEAT+.3) return calibDone(); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function calibTap(){
  const adj=ctx.currentTime-outLat(); blip(ctx.currentTime,1320,.05,'square',.1);
  const k=Math.round((adj-C.t0)/BEAT); if(k<3||k>=C.n) return;
  const d=adj-(C.t0+k*BEAT); if(Math.abs(d)<.25) C.taps.push(d);
}
function calibDone(){
  if (C.taps.length>=4){ const s=[...C.taps].sort((a,b)=>a-b); calib=s[Math.floor(s.length/2)]; try{localStorage.setItem('rm-calib',calib)}catch(e){} }
  show('title'); showCalibNote();
  if (C.taps.length<4) $('#calib-note').textContent='有效點擊太少，請再校正一次';
}

// ---- input ----
document.addEventListener('keydown', e=>{
  if (e.target.id==='name') { if(e.code==='Enter') start(); return; }
  if (e.repeat) return;
  if (e.code==='Space'){ e.preventDefault(); if(mode==='play') press(); else if(mode==='calib') calibTap(); }
  if (e.code==='KeyF' && mode==='play') assist();
});
$('#btn-press').addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });
$('#btn-aide').addEventListener('pointerdown', e=>{ e.preventDefault(); if(!e.currentTarget.disabled) assist(); });
$('#calib-tap').addEventListener('pointerdown', e=>{ e.preventDefault(); calibTap(); });
$('#btn-start').addEventListener('click', start);
$('#btn-calib').addEventListener('click', calibStart);
$('#btn-again').addEventListener('click', start);
$('#btn-home').addEventListener('click', ()=>show('title'));
</script>
